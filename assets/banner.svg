<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="DPDF — dark mode for every PDF, colors stay true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17121a"/>
      <stop offset="1" stop-color="#2a2522"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7ecd2"/>
      <stop offset="0.55" stop-color="#eadfc8"/>
      <stop offset="1" stop-color="#e8a04c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1f1"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24201b"/>
      <stop offset="1" stop-color="#1d1a17"/>
    </linearGradient>
  </defs>

  <rect width="880" height="230" rx="18" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <circle cx="700" cy="38" r="2.2" fill="#f7ecd2">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="-0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="70" r="1.6" fill="#f7ecd2">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="-1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="30" r="1.4" fill="#f7ecd2">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="-0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="110" r="1.8" fill="#f7ecd2">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="-1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="150" r="1.3" fill="#f7ecd2">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="-0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="60" r="1.2" fill="#f7ecd2">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="-2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- crescent moon -->
  <g>
    <circle cx="836" cy="60" r="22" fill="#f0e6c8">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="844" cy="54" r="19" fill="url(#bg)"/>
  </g>

  <!-- PDF page flipping day/night -->
  <g>
    <rect x="52" y="52" width="100" height="132" rx="9" fill="url(#paper)" stroke="#c9c2b8" stroke-width="1">
      <animate attributeName="fill" values="url(#paper);url(#paper);url(#night);url(#night);url(#paper)" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#c9c2b8;#c9c2b8;#4a423c;#4a423c;#c9c2b8" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <path d="M152 52 L152 76 L128 52 Z" fill="#d8d2c8">
      <animate attributeName="fill" values="#d8d2c8;#d8d2c8;#3a342f;#3a342f;#d8d2c8" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- red heading line -->
    <rect x="66" y="72" width="52" height="9" rx="3" fill="#d94f3d">
      <animate attributeName="fill" values="#d94f3d;#d94f3d;#f2a08c;#f2a08c;#d94f3d" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- body text lines -->
    <rect x="66" y="94" width="70" height="6" rx="3" fill="#4a4a4a">
      <animate attributeName="fill" values="#4a4a4a;#4a4a4a;#eadfc8;#eadfc8;#4a4a4a" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="66" y="108" width="62" height="6" rx="3" fill="#4a4a4a">
      <animate attributeName="fill" values="#4a4a4a;#4a4a4a;#eadfc8;#eadfc8;#4a4a4a" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="66" y="122" width="70" height="6" rx="3" fill="#4a4a4a">
      <animate attributeName="fill" values="#4a4a4a;#4a4a4a;#eadfc8;#eadfc8;#4a4a4a" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- a tiny photo that never changes -->
    <rect x="66" y="140" width="34" height="26" rx="3" fill="#ff5252"/>
    <rect x="80" y="140" width="20" height="13" rx="2" fill="#4cd964"/>
    <rect x="66" y="153" width="14" height="13" rx="2" fill="#2f8fff"/>
    <text x="104" y="159" font-family="Verdana, Arial, sans-serif" font-size="9" fill="#8a7f74">photo: untouched</text>
    <rect x="66" y="172" width="70" height="6" rx="3" fill="#4a4a4a">
      <animate attributeName="fill" values="#4a4a4a;#4a4a4a;#eadfc8;#eadfc8;#4a4a4a" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- toggle that flips with the page -->
  <g>
    <rect x="205" y="98" width="58" height="28" rx="14">
      <animate attributeName="fill" values="#57504a;#57504a;#3f6b4f;#3f6b4f;#57504a" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cy="112" r="10" fill="#f7ecd2" cx="219">
      <animate attributeName="cx" values="219;219;249;249;219" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="210" y="146" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#9a9186">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>dark: ON</text>
    <text x="204" y="146" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#9a9186" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.07;0.18;0.9;1" dur="7s" repeatCount="indefinite"/>native viewer</text>
  </g>

  <!-- title + subtitle -->
  <text x="310" y="118" font-family="Verdana, Arial, sans-serif" font-size="64" font-weight="bold" letter-spacing="8" fill="url(#gold)">DPDF</text>
  <text x="312" y="152" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#d8cfc2">Every PDF, dressed for midnight.</text>
  <text x="312" y="178" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#9a9186">colors stay true &#8226; photos untouched &#8226; nothing leaves your device</text>

  <!-- soft glow pulse under title -->
  <rect x="310" y="126" width="212" height="3" rx="1.5" fill="#e8a04c" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom meta strip -->
  <text x="24" y="212" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#7d756b">Chrome &#183; Edge &#183; MV3 &#183; built on pdf.js</text>
</svg>
