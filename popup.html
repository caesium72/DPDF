<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DPDF</title>
<style>
  body { width: 220px; margin: 0; padding: 14px; background: #262220; color: #f0ece8; font-family: system-ui, sans-serif; }
  h1 { margin: 0 0 12px; font-size: 15px; letter-spacing: 2px; color: #d9d2cc; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
  .slider { position: absolute; inset: 0; background: #57504a; border-radius: 12px; transition: background 0.15s; }
  .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #f0ece8; border-radius: 50%; transition: transform 0.15s; }
  input:checked + .slider { background: #9aa0a6; }
  input:checked + .slider::before { transform: translateX(20px); }
  #state { font-size: 11px; color: #a89e96; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>DPDF</h1>
  <div class="row">
    <label for="on">Dark PDFs</label>
    <span class="switch"><input type="checkbox" id="on"><span class="slider"></span></span>
  </div>
  <div id="state"></div>
  <script src="popup.js"></script>
</body>
</html>
